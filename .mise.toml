# hypergraph-rs task runner — ported 2026-07-22 from babylon's rust:* namespace
# when this repo moved out of the babylon tree (babylon commit 7ea1dcbb).
# House rules unchanged (ai/tooling.yaml doctrine in babylon, rust section of
# which now lives here): one invocation source of truth, CI runs what devs run,
# loud failure, pinned everything.
#
# Toolchain: rust-toolchain.toml pins 1.100.0 (rustup selects it by cwd
# ancestry; a nix-provided cargo of the same version satisfies the pin
# without rustup). The MSRV floor lives in Cargo.toml rust-version and covers
# every feature; rust:msrv checks it.
#
# NOTE rust:fixtures regenerates crates/hypergraph-rs/conformance/xgi_ground_truth.json
# from the live XGI 0.10.2 oracle in .venv (read-only reference install — NEVER
# babylon's venv). It is deliberately NOT part of rust:check: the committed JSON
# is the contract tests/conformance/main.rs replays against, and regeneration is
# a manual, reviewed act, not a CI-gated one.

[tasks."rust:check"]
description = "Rust full gate: format:check + lint (clippy -D warnings) + test + doc — CI parity. Sequential run-block, NOT parallel depends: one cargo target dir has one file lock, so parallel legs only contend (machine-safety: heavy builds single-flight)"
run = """
set -e
cargo fmt --all -- --check
cargo clippy --workspace --all-targets --locked -- -D warnings
cargo test --workspace --locked
RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked
# The core crate again with every feature on. `network`, `cells3d` and
# `raster-png` are in no binding, so the workspace legs above never build them
# and never run their tests.
cargo clippy -p hypergraph-rs --all-features --all-targets --locked -- -D warnings
cargo test -p hypergraph-rs --all-features --locked
RUSTDOCFLAGS='-D warnings' cargo doc -p hypergraph-rs --all-features --no-deps --locked
mise run rust:features
"""

[tasks."rust:features"]
description = "Every feature of the core crate builds on its own, without the defaults: what a consumer with default-features = false gets. Part of rust:check."
run = """
set -e
cargo check -p hypergraph-rs --no-default-features --locked
FEATURES=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c '
import json, sys
for package in json.load(sys.stdin)[\"packages\"]:
    if package[\"name\"] == \"hypergraph-rs\":
        print(\" \".join(sorted(f for f in package[\"features\"] if f != \"default\")))
')
test -n "$FEATURES"
for feature in $FEATURES; do
  echo "feature alone: $feature"
  cargo check -p hypergraph-rs --no-default-features --features "$feature" --locked
done
"""

[tasks."rust:format"]
description = "Rust format (rewrites; the CI-parity variant is rust:format:check)"
run = "cargo fmt --all"

[tasks."rust:format:check"]
description = "Rust format check, no rewrites (CI parity)"
run = "cargo fmt --all -- --check"

[tasks."rust:lint"]
description = "Clippy on the workspace, all targets, warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks."rust:test"]
description = "Rust workspace tests (locked)"
run = "cargo test --workspace --locked"

[tasks."rust:doc"]
description = "Build Rust API docs (no deps), rustdoc warnings denied"
run = "RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps --locked"

[tasks."rust:fixtures"]
description = "Regenerate the XGI conformance fixture from the live XGI 0.10.2 oracle (.venv, read-only reference install). NOT part of rust:check — the committed JSON is the contract."
run = ".venv/bin/python crates/hypergraph-rs/conformance/generate_fixtures.py"

[tasks."rust:msrv"]
description = "MSRV floor check against the rust-version declared in Cargo.toml: the workspace, then the core crate with every feature on"
run = """
set -e
MSRV=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
echo "MSRV floor: $MSRV"
rustup toolchain install "$MSRV" --profile minimal
cargo +"$MSRV" check --workspace --locked
# The workspace leg builds only the features a binding turns on. `network`,
# `cells3d` and `raster-png` are in no binding, so the core crate is built
# once more with every feature.
cargo +"$MSRV" check -p hypergraph-rs --locked --all-features
"""

[tasks."py:build"]
description = "Build the PyO3 wheel via maturin (crates/hypergraph-rs-python -> hypergraph_rs._hypergraph_rs_core). Consumers normally never run this: babylon's uv resolves the path dependency and builds the wheel itself"
run = "uvx maturin build --manifest-path crates/hypergraph-rs-python/Cargo.toml"

[tasks."py:manifest"]
description = "Regenerate python/hypergraph_rs/compat/manifest.json from the built extension + authored TOMLs. Requires real xgi 0.10.2 installed (differential oracle)."
run = ".venv/bin/python -m tools.gen_manifest"

[tasks."py:symbols"]
description = "Regenerate tests/DEFERRED_SYMBOLS.md from the built extension + authored TOMLs. Requires real xgi 0.10.2 installed (differential oracle). py:gate only CHECKS this file (--check, no write); run this task and commit the result when the ledger drifts."
run = ".venv/bin/python -m tools.audit_symbols"

[tasks."py:gate"]
description = "The XGI conformance gate, exactly as CI runs it: symbol audit (read-only — fails on a stale committed ledger rather than regenerating it; see py:symbols), manifest drift + registry integrity + denominator + oracle integrity, then the ported suite. Sequential — heavy builds single-flight. Override the interpreter with PY=... (CI passes PY=python, which resolves to the setup-python + maturin develop environment)."
run = """
set -e
PY="${PY:-.venv/bin/python}"
rm -f .gate-stats.json
$PY -m tools.audit_symbols --check
$PY -m pytest tests/ --ignore=tests/ported -q
$PY -m pytest tests/ported -q
$PY -m tools.gate_report --from-stats .gate-stats.json
"""
