# cargo-deny configuration. Run locally with `cargo deny check`; CI runs it in
# .github/workflows/supply-chain.yml on every change and once a week.

[graph]
# Check the graph with every feature on, so an optional dependency (h3o, png,
# the bindings' pyo3 and wasm-bindgen) is covered as well.
all-features = true

[advisories]
version = 2
# A yanked crate is refused: it was withdrawn by its own maintainers.
yanked = "deny"
# Advisories accepted for a stated reason go here, each with its reason.
ignore = []

[licenses]
version = 2
# The licenses of the dependency graph as it stands. This crate is
# BSD-3-Clause; everything here is compatible with shipping under it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

# priority-queue (a dependency of rustworkx-core) is offered under
# "LGPL-3.0-or-later OR MPL-2.0". It is taken under MPL-2.0, whose terms apply
# to that crate's own files and not to code that uses it. MPL-2.0 is allowed
# for this one crate only, so a new copyleft dependency is still refused.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "priority-queue"

[bans]
# Two versions of one crate in the graph is reported, not refused: the fix is
# usually upstream.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
