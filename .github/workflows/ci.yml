name: Rust gate

# Ported 2026-07-22 from babylon's .github/workflows/rust.yml when this repo
# moved out of the babylon tree. DORMANT until this repo has a remote —
# publishing (and any GitHub repo) is an owner decision (plans/EXECUTION-STATE.md).
# House rules (babylon Constitution III.11 — Loud Failure):
#   - every job carries timeout-minutes (a hang dies loudly);
#   - no continue-on-error;
#   - steps invoke the same mise tasks devs run locally — one invocation
#     source of truth (rust-toolchain.toml is the identical pin for CI and
#     local dev).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    name: Rust gate (fmt, clippy -D warnings, test, doc)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      # Pre-warm the pinned toolchain so a download failure surfaces here,
      # not mid-gate.
      - name: rustup toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: "Full gate (identical to local — mise run rust:check)"
        run: mise run rust:check

  rust-msrv:
    name: MSRV floor (rust-version 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Cache cargo registry + target dir (MSRV-keyed)
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: "MSRV floor check (identical to local — mise run rust:msrv)"
        run: mise run rust:msrv
