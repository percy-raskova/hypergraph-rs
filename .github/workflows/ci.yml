name: Rust gate

# Ported 2026-07-22 from babylon's .github/workflows/rust.yml when this repo
# moved out of the babylon tree.
# House rules (Loud Failure):
#   - every job carries timeout-minutes (a hang dies loudly);
#   - no continue-on-error;
#   - steps invoke the same mise tasks devs run locally — one invocation
#     source of truth (rust-toolchain.toml is the identical pin for CI and
#     local dev);
#   - every action is pinned to a full commit, with its version in a comment.
#     Dependabot (.github/dependabot.yml) moves the pins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-gate:
    name: Rust gate (fmt, clippy -D warnings, test, doc)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Pre-warm the pinned toolchain so a download failure surfaces here,
      # not mid-gate.
      - name: rustup toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain

      - name: "Full gate (identical to local — mise run rust:check)"
        run: mise run rust:check

  rust-msrv:
    name: MSRV floor (rust-version 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true

      - name: Cache cargo registry + target dir (MSRV-keyed)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv

      - name: "MSRV floor check (identical to local — mise run rust:msrv)"
        run: mise run rust:msrv

  # The XGI conformance gate (build + test only; nothing is published).
  xgi-conformance:
    name: "Python bindings — XGI conformance gate (hashseed ${{ matrix.hashseed }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # A test that pins CPython hash-set iteration order passes under one
        # seed and fails under others (spec F2). Several fixed seeds plus one
        # random draw catch that class of defect; `0` disables randomization
        # entirely, which is the reproducible baseline.
        hashseed: ["0", "1", "42", "random"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
        with:
          cache: true
      # `maturin develop` installs into a virtualenv and refuses to run
      # without one. `.venv` is also where the mise tasks look for the
      # interpreter, so the gate below runs exactly as it does locally.
      - name: Create .venv
        run: python -m venv .venv
      - name: Install the build and test tools
        run: .venv/bin/python -m pip install maturin pytest -r tests/requirements-dev.txt
      - name: Install the XGI oracle (test-only differential reference)
        run: .venv/bin/python -m pip install "xgi==0.10.2"
      - name: Build the extension into .venv
        run: .venv/bin/maturin develop
      - name: "XGI conformance gate (identical to local — mise run py:gate)"
        run: mise run py:gate
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}

  wheel-build:
    name: Python bindings — release wheel smoke (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pip install maturin
      - run: maturin build --release --out dist        # build wheel to dist/, do NOT upload
      - run: python -c "import glob; assert glob.glob('dist/*.whl'), 'no wheel built'"
