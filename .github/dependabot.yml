# Dependabot keeps the Rust dependencies and the pinned workflow actions
# current. Security updates are raised at once; version updates come weekly.
# Compatible (minor and patch) Rust updates arrive as one pull request, a new
# major version as its own, because a major version usually needs code changes.
#
# The Python side has no pinned dependencies to update: the package declares
# lower bounds only, and the XGI test oracle is pinned on purpose in the
# conformance job.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      rust-compatible:
        update-types:
          - minor
          - patch
    ignore:
      # sprs 0.11.5 and later need Rust 1.88, above this crate's floor of
      # 1.85 (`rust-version` in Cargo.toml; `mise run rust:msrv` checks it).
      # Remove this entry when the floor is raised to 1.88 or beyond. An
      # ignored version is held back for security updates too, so cargo-deny
      # stays the check that reports an advisory against the held version.
      - dependency-name: sprs
        versions: [">= 0.11.5"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
