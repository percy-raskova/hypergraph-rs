[workspace]
members = [
    "crates/hypergraph-rs",
    "crates/hypergraph-rs-python",
    "crates/hypergraph-rs-wasm",
    "crates/hypergraph-rs-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["Persephone Raskova <percy@percypedia.biz>"]
# Mirrored on both forges under percy-raskova/babylon; Cargo has one
# `repository` slot, so Codeberg rides in `homepage`.
repository = "https://github.com/percy-raskova/babylon"
homepage = "https://codeberg.org/percy-raskova/babylon"

[workspace.dependencies]
# NO direct petgraph dependency: rustworkx-core 0.18 re-exports petgraph 0.8;
# all petgraph types are reached via rustworkx_core::petgraph. A direct pin
# (the spec's original petgraph = "0.6") resolves to a SECOND type-incompatible
# petgraph copy (verified empirically via cargo tree, 2026-07-18 preflight).
rustworkx-core = "0.18"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# RNG line pinned to match what rustworkx-core 0.18 resolves (rand 0.10.2 /
# rand_pcg 0.10.2 / rand_core 0.10.1) so Cargo unifies to a single copy.
# rand 0.10 moved range sampling onto the RngExt trait: sampling code must
# `use rand::RngExt;` for `.random_range(..)` (2026-07-18 probe, CONFIRMED).
rand = "0.10.2"
rand_pcg = "0.10.2"
rand_core = "0.10.1"
rayon = "1"
ndarray = "0.17"
sprs = "0.11"
