[package]
name = "hypergraph-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A Rust port of XGI — hypergraph library built on rustworkx-core"

[dependencies]
rustworkx-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_pcg = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
ndarray.workspace = true
sprs.workspace = true

[features]
default = ["algorithms", "generators", "stats", "readwrite", "layout", "viz"]
all = ["default", "dynamics", "communities", "convert", "network"]
algorithms = []
generators = ["dep:rand_pcg", "dep:rand_core"]
stats = []
readwrite = []
layout = ["dep:rand_pcg"]
viz = ["layout"]
dynamics = ["dep:rand_pcg", "dep:rand_core"]
communities = ["dep:rand_pcg", "dep:rand_core"]
convert = []
network = []
