[package]
name = "hypergraph-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hypergraphs for Rust: a port of XGI built on rustworkx-core, with a value on every membership"
readme = "../../README.md"
documentation = "https://docs.rs/hypergraph-rs"
keywords = ["hypergraph", "graph", "network", "higher-order", "simplicial"]
categories = ["data-structures", "science", "mathematics"]

[dependencies]
rustworkx-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_pcg = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
ndarray.workspace = true
sprs.workspace = true
h3o = { workspace = true, optional = true }
png = { workspace = true, optional = true }

[features]
default = ["algorithms", "generators", "stats", "readwrite", "layout", "viz", "raster", "geometry"]
all = ["default", "dynamics", "communities", "convert", "network", "cells3d", "raster-png", "geometry"]
algorithms = []
generators = ["dep:rand_pcg", "dep:rand_core"]
stats = []
readwrite = []
layout = ["dep:rand_pcg"]
viz = ["layout"]
dynamics = ["dep:rand_pcg", "dep:rand_core"]
communities = ["dep:rand_pcg", "dep:rand_core"]
convert = []
network = []
raster = ["viz", "algorithms"]
cells3d = ["raster", "communities", "dep:h3o"]
raster-png = ["cells3d", "dep:png"]
geometry = []

[package.metadata.docs.rs]
all-features = true
