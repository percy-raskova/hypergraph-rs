[package]
name = "hypergraph-rs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CLI for hypergraph-rs"

[[bin]]
name = "hypergraph-rs"
path = "src/main.rs"
# The binary shares its name with the library, so documenting both writes
# the same file twice. The library's docs are the ones to keep.
doc = false

# The stub uses no crate yet, and Cargo reports a dependency that nothing
# uses. The command surface brings hypergraph-rs and clap back with it.
[dependencies]
