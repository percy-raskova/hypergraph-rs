[package]
name = "hypergraph-rs-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "PyO3 bindings for hypergraph-rs"

[lib]
name = "_hypergraph_rs_core"
crate-type = ["cdylib"]

[features]
default = []
cells3d = ["hypergraph-rs/cells3d"]
raster-png = ["cells3d", "hypergraph-rs/raster-png"]

[dependencies]
# Turn on every built module (spec Sec10.1 `all` minus `network` — no network reads in the gate).
hypergraph-rs = { path = "../hypergraph-rs", version = "0.2.0", features = [
    "algorithms", "generators", "stats", "readwrite", "layout", "viz",
    "communities", "convert",
] }
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
serde_json = { workspace = true }
rustworkx-core = { workspace = true }
indexmap = { workspace = true }
ndarray = { workspace = true }
sprs = { workspace = true }
flate2 = "1.1.9"
