# compat/partial_symbols.toml
#
# Symbols the manifest calls `bound` — meaning "not routed through the _deferred
# stub factory" — that nonetheless raise for ordinary arguments. Without this
# file a compat checker reports them as usable. The exception raised is NOT
# always NotImplementedError; each entry names its own.
#
# Schema, one table per site:
#
#   [[partial_symbol]]
#   symbol    = "degree_assortativity"   # the public name in __all__
#   class     = "core-gap"               # one of tools/taxonomy.py CLASSES
#   exception = "NotImplementedError"    # what it actually raises
#   site      = "crates/.../algorithms.rs:163"  # or the symbol's __module__, for env-gated entries with no call site
#   trigger   = "exact=False"            # the argument shape that raises
#   reason    = "..."                    # xgi's side of the gap: its differing behaviour, or the packaging fact when no call-site comparison exists
#
# An entry here promotes the symbol to `bound-partial` in manifest.json. When a
# gap is CLOSED, delete its entry — tests/test_partial_symbols.py pins the
# raising behaviour for the sites it can reach, so a fix that leaves the entry
# breaks the build.
#
# `symbol` must be a name in `hypergraph_rs.__all__` (symbol_status() only
# classifies top-level names — see tools/symbol_status.py). Some sites raise
# inside instance methods reached through a class rather than through a
# top-level callable; for those, `symbol` names the enclosing class and
# `site`/`trigger`/`reason` carry the exact dotted call shape.
#
# A symbol's ABSENCE from this file is NOT a statement that it never raises —
# it may simply be unmeasured.

[[partial_symbol]]
symbol = "degree_assortativity"
class = "core-gap"
exception = "NotImplementedError"
site = "crates/hypergraph-rs-python/src/algorithms.rs:163"
trigger = "exact=False (the default) — any kind/num_samples/seed; the bare call degree_assortativity(H) already hits this"
reason = "Random-sampling assortativity path awaits the Phase-4 rand_pcg pin (module doc, algorithms.rs). Only exact=True is ported. xgi's exact=False path returns a Python float when the sampled degree pairs have variance (measured: -0.647 on a varied-degree fixture) but returns the literal int 0, not a float, when corrcoef is NaN from zero variance — the uniform-triangle fixture this entry's own test uses hits exactly that path, with a 'RuntimeWarning: invalid value encountered in divide'. Verified against real xgi 0.10.2."

[[partial_symbol]]
symbol = "DiHypergraph"
class = "binding-gap"
exception = "NotImplementedError"
site = "crates/hypergraph-rs-python/src/dihypergraph.rs:2190 (DiStat::__call__, via the in_degree getter at :1470-1484)"
trigger = "Invoking the Stat as a function at all — D.nodes.in_degree(...) or even D.nodes.in_degree() with zero arguments. The bare property access D.nodes.in_degree (no call) does not raise."
reason = "The in_degree getter constructs DiStat with both degree_source and edge_source None, so __call__'s fallback branch always raises. xgi re-dispatches and returns a filtered/re-parametrized Stat instead. Not covered by any ported test (untested per the T1 recon) and not in exclusions.toml."

[[partial_symbol]]
symbol = "DiHypergraph"
class = "binding-gap"
exception = "NotImplementedError"
site = "crates/hypergraph-rs-python/src/dihypergraph.rs:2190 (DiStat::__call__, via the out_degree getter at :1488-1502)"
trigger = "Invoking the Stat as a function at all, including zero-arg D.nodes.out_degree()."
reason = "Identical root cause and fix to in_degree: the out_degree getter also constructs DiStat with both sources None. xgi returns a valid re-parametrized Stat; ours raises unconditionally on call."

[[partial_symbol]]
symbol = "Hypergraph"
class = "binding-gap"
exception = "NotImplementedError"
site = "crates/hypergraph-rs-python/src/stats.rs:471 (PyEdgeStat::__call__, EdgeStatKind::Attr arm)"
trigger = "Re-invoking the EdgeStat returned by H.edges.attrs(key) with zero arguments — H.edges.attrs('color')(). A str positional instead raises TypeError from PyO3 extraction before the Attr arm is reached. Only the Attr kind raises; Size/Order re-parametrize fine on the same __call__."
reason = "PyEdgeStat's Attr arm is the one EdgeStatKind that never got a re-parametrization branch (contrast PyNodeStat::Attr at stats.rs:280-293, which does re-parametrize and does not raise for the identical H.nodes.attrs(key)() shape). xgi returns a re-dispatched Stat, not an error."

[[partial_symbol]]
symbol = "draw"
class = "env"
exception = "ImportError"
site = "hypergraph_rs.drawing"
trigger = "any call in an environment without matplotlib installed"
reason = "hypergraph-rs makes matplotlib an optional `mpl` extra, so this symbol imports and raises only at call time. xgi 0.10.2 hard-depends on matplotlib (Requires-Dist: matplotlib>=3.4), so the same environment cannot host xgi at all. This entry records the raise-on-missing-matplotlib path only — it is NOT the only divergence: with matplotlib present, the call site itself diverges too (draw returns a bare Axes where xgi returns a tuple; see D39, compat/divergences.toml)."

[[partial_symbol]]
symbol = "draw_nodes"
class = "env"
exception = "ImportError"
site = "hypergraph_rs.drawing"
trigger = "any call in an environment without matplotlib installed"
reason = "hypergraph-rs makes matplotlib an optional `mpl` extra, so this symbol imports and raises only at call time. xgi 0.10.2 hard-depends on matplotlib (Requires-Dist: matplotlib>=3.4), so the same environment cannot host xgi at all. This entry records the raise-on-missing-matplotlib path only — it is NOT the only divergence: with matplotlib present, draw_nodes is a literal alias of draw, not xgi's dedicated node-only renderer (see D39, compat/divergences.toml)."

[[partial_symbol]]
symbol = "draw_hyperedges"
class = "env"
exception = "ImportError"
site = "hypergraph_rs.drawing"
trigger = "any call in an environment without matplotlib installed"
reason = "hypergraph-rs makes matplotlib an optional `mpl` extra, so this symbol imports and raises only at call time. xgi 0.10.2 hard-depends on matplotlib (Requires-Dist: matplotlib>=3.4), so the same environment cannot host xgi at all. This entry records the raise-on-missing-matplotlib path only — it is NOT the only divergence: with matplotlib present, draw_hyperedges is a literal alias of draw, not xgi's dedicated hyperedges-only renderer (see D39, compat/divergences.toml)."
