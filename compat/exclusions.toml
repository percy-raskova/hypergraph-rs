reason = "binding gap: `H._net_attr` (and `_node_attr`/`_edge_attr`) return a snapshot PyDict copy, not a live reference into the binding's Rust-side attr store — real XGI's `_net_attr` IS the live dict, so `del H1._net_attr['test']` mutates it in place; here the deletion is silently lost. `xgi.equal` itself is correctly implemented (verified: the assertions up to and including `H1['test'] = ...` all pass). A live-reference fix needs a custom mutable-mapping proxy type wired to the core attr store — out of scope for this binding pass; not a core gap (Task 15 triage bucket 1, deferred as a documented binding limitation rather than fixed here)."

