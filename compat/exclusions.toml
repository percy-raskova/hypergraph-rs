# Conformance exclusion registry (spec §4 C2).
# Keys are EXACT test names: `test_name` or `ClassName::test_name`.
# Every entry carries one `class` from the closed taxonomy:
#   deferred-symbol | core-gap | binding-gap | divergence
#   float-parity | upstream-private | env | upstream-bug | out-of-scope
# `env`, `upstream-bug`, and `out-of-scope` produce skip; everything else
# xfail(strict). (out-of-scope added during Task 4 adjudication: a test that
# runs fine but whose result says nothing about the port — see
# docs/superpowers/plans/2026-07-30-xgi-honest-gate-t0.md.)

