# compat/method_gaps.toml
#
# Public names XGI 1.1 has on a class, view or stat that the library's counterpart lacks,
# found by tools/audit_methods.py. tests/test_method_audit.py is strict both ways: a missing
# name with no entry fails, and an entry whose name now exists fails. When a gap is closed,
# delete its entry in the same commit. Schema, one table per gap:
#
#   [[gap]]
#   subject = "Hypergraph.nodes"  # the audited object (tools/audit_methods.py subjects())
#   name    = "get"               # the missing public name
#   class   = "binding-gap"        # one of tools/taxonomy.py CLASSES
#   reason  = "..."
#   owner   = "xgi-1-1-raise:T14" # optional; the task or plan that closes it

[[gap]]
subject = "DiHypergraph"
name = "clear"
class = "binding-gap"
reason = "The core has this method; the Python class does not bind it."

[[gap]]
subject = "DiHypergraph.edges"
name = "attrs"
class = "binding-gap"
reason = "XGI's IDView is a dict-like view with this method; the library's view has the narrower surface the ported tests use."

[[gap]]
subject = "DiHypergraph.edges"
name = "duplicate_groups"
class = "divergence"
reason = "XGI 1.1's inherited duplicate_groups on the directed views groups by the keys of each {in, out} dict, so every id lands in one group (an upstream defect); the library leaves the method out. Task 21 registers it in compat/divergences.toml."

